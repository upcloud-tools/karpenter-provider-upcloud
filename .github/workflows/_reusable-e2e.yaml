on:
  workflow_call:
    inputs:
      run_ttl:
        required: false
        type: boolean
        default: true
      image_tag:
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubeconfig
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy via Helm
        env:
          CONTAINER_REPO: ${{ env.REGISTRY }}/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
          UPCLOUD_KUBERNETES_CLUSTER_ID: ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }}
        run: make deploy-test

  e2e:
    timeout-minutes: 10
    needs: deploy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloudnative on-demand
            test: TestLiveCloudProviderCreate
            plans: CLOUDNATIVE-1xCPU-4GB,CLOUDNATIVE-2xCPU-4GB
            capacityType: on-demand
            enabled: true
          - name: gpu spot
            test: TestLiveCloudProviderCreate
            plans: GPU-SPOT-8xCPU-64GB-1xL4,GPU-8xCPU-64GB-1xL4
            capacityType: spot
            enabled: true
          - name: bundled storage
            test: TestLiveCloudProviderCreateBundledStorage
            plans: STARTER-1xCPU-2GB,STARTER-2xCPU-2GB
            capacityType: on-demand
            enabled: true
          - name: TTL
            test: TestLiveNodeClaimTTL
            plans: CLOUDNATIVE-1xCPU-4GB,CLOUDNATIVE-2xCPU-4GB
            capacityType: on-demand
            enabled: ${{ inputs.run_ttl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure kubeconfig
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Live e2e (${{ matrix.name }})
        if: ${{ matrix.enabled }}
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
          UPCLOUD_KUBERNETES_CLUSTER_ID: ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }}
        run: make test-e2e E2E_TEST="${{ matrix.test }}" E2E_PLANS="${{ matrix.plans }}" E2E_CAPACITY_TYPE="${{ matrix.capacityType }}"
