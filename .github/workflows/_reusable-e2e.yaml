on:
  workflow_call:
    inputs:
      k8s_version:
        required: true
        type: string
      run_ttl:
        required: false
        type: boolean
        default: true
      image_tag:
        required: false
        type: string
        default: latest
    secrets:
      KUBE_CONFIG:
        required: true
      UPCLOUD_TOKEN:
        required: true
      UPCLOUD_KUBERNETES_CLUSTER_ID:
        required: true

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: [self-hosted, linux, upcloud]
    container:
      image: ghcr.io/upcloud-tools/github-runner:latest
    env:
      KUBECTL_VERSION: ${{ inputs.k8s_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubeconfig
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Scale up node group (k8s ${{ inputs.k8s_version }})
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: upctl kubernetes node-group scale ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }} --name default --count 2

      - name: Wait for nodes to be Ready
        run: kubectl wait --for=create --for=condition=Ready node --all --timeout=300s

      - name: Create UpCloud token secret
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: kubectl create secret generic upcloud --namespace kube-system --from-literal=token="$UPCLOUD_TOKEN" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via Helm (k8s ${{ inputs.k8s_version }})
        env:
          CONTAINER_REPO: ${{ env.REGISTRY }}/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
          UPCLOUD_KUBERNETES_CLUSTER_ID: ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }}
        run: make deploy-test

  e2e:
    timeout-minutes: 10
    needs: deploy
    runs-on: [self-hosted, linux, upcloud]
    container:
      image: ghcr.io/upcloud-tools/github-runner:latest
    env:
      KUBECTL_VERSION: ${{ inputs.k8s_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CloudNative on-demand
            test: TestLiveCloudProviderCreate
            plans: CLOUDNATIVE-1xCPU-4GB,CLOUDNATIVE-2xCPU-4GB
            capacityType: on-demand
            enabled: true
          - name: GPU spot
            test: TestLiveCloudProviderCreate
            plans: GPU-SPOT-8xCPU-64GB-1xL4,GPU-8xCPU-64GB-1xL4
            capacityType: spot
            enabled: true
          - name: Bundled storage on-demand
            test: TestLiveCloudProviderCreateBundledStorage
            plans: STARTER-1xCPU-2GB,STARTER-2xCPU-2GB
            capacityType: on-demand
            enabled: true
          - name: TTL on-demand
            test: TestLiveNodeClaimTTL
            plans: CLOUDNATIVE-1xCPU-4GB,CLOUDNATIVE-2xCPU-4GB
            capacityType: on-demand
            enabled: ${{ inputs.run_ttl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: e2e-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            e2e-go-

      - name: Configure kubeconfig
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Live e2e (${{ matrix.name }}, k8s ${{ inputs.k8s_version }})
        if: ${{ matrix.enabled }}
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
          UPCLOUD_KUBERNETES_CLUSTER_ID: ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }}
        run: make test-e2e E2E_TEST="${{ matrix.test }}" E2E_PLANS="${{ matrix.plans }}" E2E_CAPACITY_TYPE="${{ matrix.capacityType }}"

  cleanup:
    if: always()
    needs: e2e
    runs-on: [self-hosted, linux, upcloud]
    container:
      image: ghcr.io/upcloud-tools/github-runner:latest
    env:
      KUBECTL_VERSION: ${{ inputs.k8s_version }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scale down node group (k8s ${{ inputs.k8s_version }})
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: upctl kubernetes node-group scale ${{ secrets.UPCLOUD_KUBERNETES_CLUSTER_ID }} --name default --count 0
