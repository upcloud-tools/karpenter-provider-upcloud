name: OpenSSF Scorecard

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - cmd/karpenter-upcloud/Containerfile
      - '.github/workflows/**'
      - '.golangci.yml'
      - '.trivyignore.yaml'
  schedule:
    - cron: "00 06 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: upcloud-tools/gha-actions/.github/workflows/scorecard.yaml@6666b24558f9c6f4acbf12f5e186b81351f20ffb
    secrets: inherit
