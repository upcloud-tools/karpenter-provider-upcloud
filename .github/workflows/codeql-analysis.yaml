name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - '.github/workflows/codeql-analysis.yaml'
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  GO_VERSION: '1.26.5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - go.mod
              - go.sum
              - '.github/workflows/codeql-analysis.yaml'

      - if: steps.filter.outputs.go == 'true' || github.event_name != 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - if: steps.filter.outputs.go == 'true' || github.event_name != 'pull_request'
        uses: github/codeql-action/init@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          languages: ${{ matrix.language }}

      - if: steps.filter.outputs.go == 'true' || github.event_name != 'pull_request'
        uses: github/codeql-action/autobuild@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6

      - if: steps.filter.outputs.go == 'true' || github.event_name != 'pull_request'
        uses: github/codeql-action/analyze@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
