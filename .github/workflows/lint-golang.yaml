name: Lint Golang

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - '.github/workflows/lint-golang.yaml'
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - '.github/workflows/lint-golang.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci-lint:
    uses: upcloud-tools/gha-actions/.github/workflows/lint-golang.yaml@f2881d6a065803a93a5af104f83413f4b6f31ca0 # main
