name: Release Helm chart

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - deploy/helm/Chart.yaml
  workflow_dispatch:
    inputs:
      skip-e2e:
        description: Skip e2e tests
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  CHART_DIR: deploy/helm
  REGISTRY: ghcr.io
  CHART_OCI_REPO: ${{ github.repository_owner }}/charts

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.detect.outputs.chart_release_exists }}
      chart_version: ${{ steps.detect.outputs.chart_version }}
      app_version_bumped: ${{ steps.detect.outputs.app_release_exists == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - id: detect
        uses: ./.github/actions/detect-versions
        with:
          app-version-prefix: "v"

  # The E2E tests are run when the chart version is bumped, but will be skipped if the appVersion
  # has been bumped as well. The release-app action will then run the E2E tests instead.
  e2e:
    needs: detect
    if: needs.detect.outputs.skip == 'false' && needs.detect.outputs.app_version_bumped == 'false' && !inputs['skip-e2e']
    uses: ./.github/workflows/_reusable-e2e.yaml
    secrets: inherit

  release-helm:
    needs: [detect, e2e]
    if: ${{ always() && needs.detect.outputs.skip == 'false' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: ./.github/actions/ghcr-login

      - name: Get release notes
        run: make helm-release-notes > .release_notes

      - name: Copy LICENSE into chart
        run: cp LICENSE ${{ env.CHART_DIR }}/

      - name: Package chart
        run: make helm-package

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart package
        run: |
          PACKAGE=$(ls dist/*.tgz)
          cosign sign-blob "$PACKAGE" --bundle "${PACKAGE}.sigstore.json" --yes

      - name: Push chart to GHCR OCI
        run: helm push dist/*.tgz oci://${{ env.REGISTRY }}/${{ env.CHART_OCI_REPO }}

      - name: Push Artifact Hub metadata
        run: |
          chart_name=$(yq .name "$CHART_DIR/Chart.yaml")
          oras push ${{ env.REGISTRY }}/${{ env.CHART_OCI_REPO }}/${chart_name}:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          is_prerelease="false"
          if [[ "${{ needs.detect.outputs.chart_version }}" == *-* ]]; then
            is_prerelease="true"
          fi
          gh release create "helm-v${{ needs.detect.outputs.chart_version }}" \
            dist/*.tgz \
            dist/*.sigstore.json \
            --notes-file .release_notes \
            --title "helm-v${{ needs.detect.outputs.chart_version }}" \
            --target ${{ github.sha }} \
            --draft \
            $([[ "$is_prerelease" == "true" ]] && echo "--prerelease")
