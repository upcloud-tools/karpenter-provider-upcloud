name: Lint Helm

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/lint-helm.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/lint-helm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-lint:
    uses: upcloud-tools/gha-actions/.github/workflows/lint-helm.yaml@f2881d6a065803a93a5af104f83413f4b6f31ca0 # main
    with:
      helm_template_extra_args: --set config.clusterUUID=0d000000-0000-4000-8000-000160150100
