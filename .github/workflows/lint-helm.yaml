name: Lint Helm

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint-helm.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint-helm.yaml'

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            helm:
              - 'charts/**'
              - '.github/workflows/lint-helm.yaml'

      - if: steps.filter.outputs.helm == 'true'
        name: Run helm lint
        run: make helm-lint

      - if: steps.filter.outputs.helm == 'true'
        name: Run helm unit tests
        run: make helm-unittest

      - if: steps.filter.outputs.helm == 'true'
        name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: charts/karpenter-upcloud
          config: charts/karpenter-upcloud/.kube-linter.yaml
          format: plain

      - if: steps.filter.outputs.helm == 'true'
        name: Run kubeconform
        uses: aardbol/k8s-lint@4676a66f5a37b93f2cf75ecbe498d770b9d7d2ce # v5.1.0
        with:
          manifests: charts/karpenter-upcloud/
          lintType: kubeconform
          kubeconformOpts: -summary -strict -ignore-missing-schemas
