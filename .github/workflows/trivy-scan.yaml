name: Trivy Scan

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - cmd/karpenter-upcloud/Containerfile
      - '.github/workflows/trivy-scan.yaml'
      - '.trivyignore.yaml'
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - cmd/karpenter-upcloud/Containerfile
      - '.github/workflows/trivy-scan.yaml'
      - '.trivyignore.yaml'
  schedule:
    - cron: '5 5 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: upcloud-tools/gha-actions/.github/workflows/trivy.yaml@f2881d6a065803a93a5af104f83413f4b6f31ca0 # main
    with:
      image_repo: karpenter-provider-upcloud
    secrets: inherit
