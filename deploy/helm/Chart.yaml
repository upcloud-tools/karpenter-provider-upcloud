apiVersion: v2
name: karpenter-upcloud
description: Karpenter provider for UpCloud
type: application
version: "1.1.2"
appVersion: "v1.0.1"
kubeVersion: ">=1.31.0"
keywords:
  - karpenter
  - upcloud
  - autoscaling
  - kubernetes
home: https://github.com/upcloud-tools/karpenter-provider-upcloud
sources:
  - https://github.com/upcloud-tools/karpenter-provider-upcloud
maintainers:
  - name: Leonardo (aardbol)
    url: https://github.com/aardbol
annotations:
  artifacthub.io/maintainers: |
    - name: aardbol
  artifacthub.io/license: EUPL-1.2
  artifacthub.io/links: |
    - name: Support
      url: https://github.com/upcloud-tools/karpenter-provider-upcloud/issues
  artifacthub.io/crds: |
    - kind: UpCloudNodeClass
      version: v1alpha2
      name: upcloudnodeclasses.karpenter.k8s.upcloud
      displayName: UpCloud Node Class
      description: Configuration for UpCloud node provisioning
  artifacthub.io/changes: |
    - kind: fixed
      description: Chart signing now visible on Artifact Hub (signatures stored in OCI registry)
    - kind: added
      description: artifacthub.io/crds annotation to display CRD information
    - kind: added
      description: Optional NodeClass and NodePool creation via values
    - kind: changed
      description: Improved NOTES.txt with current API references
    - kind: changed
      description: Breaking - storage values restructured to nested struct
    - kind: changed
      description: appVersion now includes v prefix (e.g., v1.0.0)