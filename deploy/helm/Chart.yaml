apiVersion: v2
name: karpenter-upcloud
description: Karpenter provider for UpCloud
type: application
version: "1.3.0"
appVersion: "v1.0.2"
kubeVersion: ">=1.31.0"
keywords:
  - karpenter
  - upcloud
  - autoscaling
  - kubernetes
home: https://github.com/upcloud-tools/karpenter-provider-upcloud
sources:
  - https://github.com/upcloud-tools/karpenter-provider-upcloud
maintainers:
  - name: Leonardo (aardbol)
    url: https://github.com/aardbol
annotations:
  artifacthub.io/maintainers: |
    - name: aardbol
  artifacthub.io/license: EUPL-1.2
  artifacthub.io/links: |
    - name: Support
      url: https://github.com/upcloud-tools/karpenter-provider-upcloud/issues
  artifacthub.io/crds: |
    - kind: NodePool
      version: v1
      name: nodepools.karpenter.sh
      displayName: NodePool
      description: Karpenter's declarative node provisioning API
    - kind: NodeClaim
      version: v1
      name: nodeclaims.karpenter.sh
      displayName: NodeClaim
      description: Karpenter's lifecycle API for individual nodes
    - kind: NodeOverlay
      version: v1
      name: nodeoverlays.karpenter.sh
      displayName: NodeOverlay
      description: Customize instance type pricing and behavior
    - kind: CapacityBuffer
      version: v1beta1
      name: capacitybuffers.autoscaling.x-k8s.io
      displayName: CapacityBuffer
      description: Reserve spare capacity for rapid scale-out (feature-gated)
    - kind: UpCloudNodeClass
      version: v1alpha2
      name: upcloudnodeclasses.karpenter.k8s.upcloud
      displayName: UpCloud Node Class
      description: Configuration for UpCloud node provisioning
  artifacthub.io/changes: |
    - kind: fixed
      description: NodeClass storage is now truly optional
    - kind: changed
      description: Bump app version to v1.0.2
