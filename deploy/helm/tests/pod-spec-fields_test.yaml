suite: pod spec fields
tests:
  - it: should not render optional fields by default
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.revisionHistoryLimit
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should render terminationGracePeriodSeconds
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      terminationGracePeriodSeconds: 60
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: should render revisionHistoryLimit when set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      revisionHistoryLimit: 5
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  - it: should render nodeSelector when set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      nodeSelector:
        kubernetes.io/arch: amd64
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64

  - it: should render tolerations when set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      tolerations:
        - key: "key1"
          operator: "Equal"
          value: "value1"
          effect: "NoSchedule"
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: key1

  - it: should render topologySpreadConstraints when set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: should render imagePullSecrets when set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      imagePullSecrets:
        - name: my-registry-creds
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: my-registry-creds
