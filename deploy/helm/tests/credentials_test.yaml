suite: credentials
tests:
  - it: should not render secret by default
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret when config.auth.token is set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
        auth:
          token: mytoken
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.token
          value: mytoken

  - it: should not render secret when config.auth.existingSecret is set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
        auth:
          existingSecret: my-existing-secret
          token: mytoken
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should use existingSecret name in deployment
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
        auth:
          existingSecret: my-existing-secret
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-existing-secret

  - it: should use custom tokenKey
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
        auth:
          existingSecret: my-secret
          tokenKey: my-token-key
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: my-token-key

  - it: should fail when clusterUUID is not set
    asserts:
      - failedTemplate:
          errorMessage: config.clusterUUID is required
        template: deployment.yaml
