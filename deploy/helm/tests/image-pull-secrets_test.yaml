suite: image pull secrets
tests:
  - it: should not render imagePullSecrets when empty
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should render imagePullSecrets when set
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      imagePullSecrets:
        - name: my-registry-creds
    template: deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.imagePullSecrets
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: my-registry-creds

  - it: should render multiple imagePullSecrets
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      imagePullSecrets:
        - name: creds-one
        - name: creds-two
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.imagePullSecrets
          count: 2
