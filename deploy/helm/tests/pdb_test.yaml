suite: pod disruption budget
tests:
  - it: should not render PDB by default
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
    template: pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render PDB when enabled with maxUnavailable
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    template: pdb.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME-karpenter-upcloud
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: should render PDB with minAvailable
    set:
      config:
        clusterUUID: 0d000000-0000-4000-8000-000160150100
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    template: pdb.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
