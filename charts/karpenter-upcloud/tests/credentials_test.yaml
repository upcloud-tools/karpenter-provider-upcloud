suite: credentials
tests:
  - it: should not render secret by default
    set:
      clusterUUID: test-uuid
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret when credentials.token is set
    set:
      clusterUUID: test-uuid
      credentials:
        token: mytoken
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.token
          value: mytoken

  - it: should not render secret when existingSecret is set
    set:
      clusterUUID: test-uuid
      existingSecret: my-existing-secret
      credentials:
        token: mytoken
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should use existingSecret name in deployment
    set:
      clusterUUID: test-uuid
      existingSecret: my-existing-secret
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-existing-secret

  - it: should use custom tokenKey
    set:
      clusterUUID: test-uuid
      existingSecret: my-secret
      existingSecretTokenKey: my-token-key
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: my-token-key

  - it: should fail when clusterUUID is not set
    asserts:
      - failedTemplate:
          errorMessage: clusterUUID is required
        template: deployment.yaml
